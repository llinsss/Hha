# Local stack: PostgreSQL + Redis + one-off migration + API.
#   JWT_ACCESS_SECRET=$(openssl rand -base64 48) docker compose up --build
# For running the API on the host instead, start only the backing services:
#   docker compose up -d postgres redis
name: houzzhills

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: houzzhills
      POSTGRES_PASSWORD: houzzhills
      POSTGRES_DB: houzzhills
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U houzzhills -d houzzhills"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # AOF persistence so idempotency keys and rate-limit state survive restarts.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["node", "dist/scripts/migrate.js", "up"]
    environment: &api-env
      # development: allows http://localhost origins. Use production settings when deploying.
      NODE_ENV: development
      DATABASE_URL: postgresql://houzzhills:houzzhills@postgres:5432/houzzhills
      REDIS_URL: redis://redis:6379/0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET (openssl rand -base64 48)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DOCS_ENABLED: "true"
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: .
    environment: *api-env
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
